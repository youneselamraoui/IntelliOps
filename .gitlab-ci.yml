# ═══════════════════════════════════════════════════════════
# IntelliOps : pipeline CI (INTELLIOPS-34) : Build et Run
# ═══════════════════════════════════════════════════════════

workflow:
  name: "IntelliOps CI - $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  timeout: 10 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure

stages:
  - build
  - run

# ═══════════════════════════════════════════════════════════
# PHASE 1 : BUILD (Installation et compilation natifs)
# ═══════════════════════════════════════════════════════════

"Backend - Build":
  stage: build
  image: serversideup/php:8.4-cli
  cache:
    key: backend-$CI_COMMIT_SHA
    paths:
      - backend/vendor/
      - backend/.env
  script:
    - cd backend
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist
    - php artisan key:generate --force

"Frontend - Build":
  stage: build
  image: node:22-alpine
  cache:
    key: frontend-$CI_COMMIT_SHA
    paths:
      - frontend/node_modules/
      - frontend/dist/
  script:
    - cd frontend
    - npm ci
    - npm run build

# ═══════════════════════════════════════════════════════════
# PHASE 2 : RUN (Exécution, connectivité DB/pgvector & migrations)
# ═══════════════════════════════════════════════════════════

"Backend - Run":
  stage: run
  image: serversideup/php:8.4-cli
  needs: ["Backend - Build"]
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_DB: intelliops_test
    POSTGRES_USER: intelliops
    POSTGRES_PASSWORD: intelliops_ci_password
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: intelliops_test
    DB_USERNAME: intelliops
    DB_PASSWORD: intelliops_ci_password
  cache:
    key: backend-$CI_COMMIT_SHA
    policy: pull
    paths:
      - backend/vendor/
      - backend/.env
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client && rm -rf /var/lib/apt/lists/*
  script:
    - cd backend
    # 1. Vérification PostgreSQL avec intervalle (2s) et timeout max (30s = 15 essais)
    - |
      TRIES=0
      until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"; do
        TRIES=$((TRIES + 1))
        if [ "$TRIES" -ge 15 ]; then echo "Timeout PostgreSQL"; exit 1; fi
        sleep 2
      done
    - PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -c "CREATE EXTENSION IF NOT EXISTS vector;"
    # 2. Test des migrations Laravel sur la base pgvector
    - php artisan migrate --force
    # 3. Démarrage du serveur et vérification HTTP (/up ou / sans erreur serveur 5xx)
    - php artisan --version
    - php artisan serve --host=127.0.0.1 --port=8000 &
    - SERVER_PID=$!
    - |
      TRIES=0
      until STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up) && [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; do
        TRIES=$((TRIES + 1))
        if [ "$TRIES" -ge 5 ]; then kill $SERVER_PID; echo "Timeout Backend (HTTP $STATUS)"; exit 1; fi
        sleep 2
      done
      echo "Backend HTTP OK (status: $STATUS)"
    - kill $SERVER_PID

"Frontend - Run":
  stage: run
  image: node:22-alpine
  needs: ["Frontend - Build"]
  cache:
    key: frontend-$CI_COMMIT_SHA
    policy: pull
    paths:
      - frontend/node_modules/
      - frontend/dist/
  script:
    - cd frontend
    - npx vite preview --host 127.0.0.1 --port 4173 &
    - PREVIEW_PID=$!
    # Vérification HTTP avec intervalle (2s) et 5 essais max
    - |
      TRIES=0
      until wget -q -O /dev/null http://127.0.0.1:4173/; do
        TRIES=$((TRIES + 1))
        if [ "$TRIES" -ge 5 ]; then kill $PREVIEW_PID; echo "Timeout Frontend"; exit 1; fi
        sleep 2
      done
    - kill $PREVIEW_PID