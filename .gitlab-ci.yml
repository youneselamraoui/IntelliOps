workflow:
  name: "IntelliOps CI - $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - run

# ═══════════════════════════════════════════════════════════
# PHASE 1 : BUILD (Installation et compilation natifs)
# ═══════════════════════════════════════════════════════════

"Backend - Build":
  stage: build
  image: php:8.4-cli-alpine
  timeout: 15 minutes
  cache:
    key: backend-$CI_COMMIT_SHA
    paths:
      - backend/vendor/
      - backend/.env
  before_script:
    - apk add --no-cache git unzip icu-dev libzip-dev libpng-dev postgresql-dev curl
    - docker-php-ext-install pdo_pgsql pgsql bcmath intl zip gd pcntl
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - cp .env.example .env
    - sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
    - sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
    - composer install --no-interaction --prefer-dist
    - php artisan key:generate --force

"Frontend - Build":
  stage: build
  image: node:22-alpine
  timeout: 15 minutes
  cache:
    key: frontend-$CI_COMMIT_SHA
    paths:
      - frontend/node_modules/
      - frontend/dist/
  script:
    - cd frontend
    - npm ci
    - npm run build

# ═══════════════════════════════════════════════════════════
# PHASE 2 : RUN (Exécution et vérification des services)
# ═══════════════════════════════════════════════════════════

"Backend - Run":
  stage: run
  image: php:8.4-cli-alpine
  needs: ["Backend - Build"]
  timeout: 10 minutes
  cache:
    key: backend-$CI_COMMIT_SHA
    policy: pull
    paths:
      - backend/vendor/
      - backend/.env
  before_script:
    - apk add --no-cache icu-dev libzip-dev libpng-dev postgresql-dev curl
    - docker-php-ext-install pdo_pgsql pgsql bcmath intl zip gd pcntl
  script:
    - cd backend
    - php artisan --version
    - php artisan route:list
    - php artisan serve --host=127.0.0.1 --port=8000 &
    - SERVER_PID=$!
    - sleep 3
    - curl -f -s -o /dev/null http://127.0.0.1:8000/
    - kill $SERVER_PID

"Frontend - Run":
  stage: run
  image: node:22-alpine
  needs: ["Frontend - Build"]
  timeout: 10 minutes
  cache:
    key: frontend-$CI_COMMIT_SHA
    policy: pull
    paths:
      - frontend/node_modules/
      - frontend/dist/
  script:
    - cd frontend
    - npx vite preview --host 127.0.0.1 --port 4173 &
    - PREVIEW_PID=$!
    - sleep 3
    - wget -q -O /dev/null http://127.0.0.1:4173/
    - kill $PREVIEW_PID