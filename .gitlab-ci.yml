# ═══════════════════════════════════════════════════════════
# IntelliOps : pipeline CI (INTELLIOPS-34) : Build et Run
# ═══════════════════════════════════════════════════════════

workflow:
  name: "IntelliOps CI - $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - run

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

default:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ═══════════════════════════════════════════════════════════
# PHASE 1 : BUILD
# ═══════════════════════════════════════════════════════════

"Backend - Build":
  stage: build
  timeout: 15 minutes
  script:
    - docker build --target production -t "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"

"Frontend - Build":
  stage: build
  timeout: 15 minutes
  script:
    - docker build --target production --build-arg VITE_API_URL=/api --build-arg VITE_KEYCLOAK_URL= -t "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"

# ═══════════════════════════════════════════════════════════
# PHASE 2 : RUN
# ═══════════════════════════════════════════════════════════

"Stack - Run":
  stage: run
  needs: ["Backend - Build", "Frontend - Build"]
  timeout: 10 minutes
  
  variables:
    APP_KEY: "base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  script:
    # le réseau et les noms backend/frontend doivent rester tels quels (nginx appelle backend:9000)
    - docker network create reseau_app
    - docker run -d --name backend --network reseau_app -e APP_KEY="$APP_KEY" "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - docker run -d --name frontend --network reseau_app "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    - sleep 15
    - docker ps
    # chaque commande qui échoue fait échouer le job
    - docker exec backend php artisan --version
    - docker exec backend php-fpm -t
    - docker exec frontend wget -q -O /dev/null http://127.0.0.1/
  after_script:
    - docker logs backend > backend.log 2>&1 || true
    - docker logs frontend > frontend.log 2>&1 || true

  artifacts:
    name: stack-logs
    when: always
    expire_in: 1 week
    paths:
      - backend.log
      - frontend.log