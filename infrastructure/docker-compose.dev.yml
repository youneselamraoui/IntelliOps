services:
  backend:
    build:
      target: development
    env_file:
      - ./infrastructure/.env.dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      target: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}

  database:
    image: pgvector/pgvector:pg16
    networks:
      - reseau_app
    ports:
      - "5432:5432"
    volumes:
      - donnees_postgres_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 5

volumes:
  donnees_postgres_dev: