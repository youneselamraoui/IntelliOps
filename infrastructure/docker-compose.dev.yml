services:
  database:
    restart: on-failure
    ports:
      - "5432:5432"

  backend:
    build:
      target: development
    restart: on-failure
    env_file:
      - ./infrastructure/.env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      target: development
    restart: on-failure
    env_file:
      - ./infrastructure/.env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend