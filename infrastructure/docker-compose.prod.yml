services:
  backend:
    build:
      target: production
    env_file:
      - ./infrastructure/.env.prod
    ports:
      - "${BACKEND_PORT:-8000}:80"
    restart: always
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      target: production
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: always
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"