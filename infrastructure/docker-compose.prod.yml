services:
  backend:
    env_file:
      - ./infrastructure/.env.prod
    restart: always
    ports:
      - "8000:80"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      target: production
    env_file:
      - ./infrastructure/.env.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: intelliops_keycloak_prod
    restart: always
    command: start --http-enabled=true --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8082:8080"
    volumes:
      - keycloak_prod_data:/opt/keycloak/data
    networks:
      - reseau_app

  prometheus:
    image: prom/prometheus:latest
    container_name: intelliops_prometheus_prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    networks:
      - reseau_app

  grafana:
    image: grafana/grafana:latest
    container_name: intelliops_grafana_prod
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_prod_data:/var/lib/grafana
    networks:
      - reseau_app

volumes:
  keycloak_prod_data:
  prometheus_prod_data:
  grafana_prod_data: