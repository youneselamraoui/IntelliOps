services:
  backend:
    env_file:
      - ./infrastructure/.env.staging
    ports:
      - "8000:80"
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      target: production
    env_file:
      - ./infrastructure/.env.staging
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          memory: 256m

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: intelliops_jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - reseau_app
    deploy:
      resources:
        limits:
          memory: 1g

  sonarqube:
    image: sonarqube:lts-community
    container_name: intelliops_sonarqube
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - reseau_app
    deploy:
      resources:
        limits:
          memory: 2g

  trivy:
    image: aquasec/trivy:latest
    container_name: intelliops_trivy
    entrypoint: ["sleep", "infinity"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache/
    networks:
      - reseau_app
    deploy:
      resources:
        limits:
          memory: 512m

  owasp-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: intelliops_zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
    ports:
      - "8090:8090"
    networks:
      - reseau_app
    deploy:
      resources:
        limits:
          memory: 1g

  prometheus:
    image: prom/prometheus:latest
    container_name: intelliops_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - reseau_app
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    image: grafana/grafana:latest
    container_name: intelliops_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - reseau_app
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  trivy_cache:
  prometheus_data:
  grafana_data: