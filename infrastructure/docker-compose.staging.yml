services:
  backend:
    build:
      target: production
    env_file:
      - ./infrastructure/.env.staging
    ports:
      - "${BACKEND_PORT:-8000}:80"
    restart: on-failure

  frontend:
    build:
      target: production
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: on-failure

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1024m
    networks:
      - reseau_app

  trivy:
    image: aquasec/trivy:latest
    profiles: ["security"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache/
    networks:
      - reseau_app

  owasp-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["security"]
    command: zap-baseline.py -t http://frontend:80
    depends_on:
      - frontend
      - backend
    networks:
      - reseau_app

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    mem_limit: 256m
    networks:
      - reseau_app

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      - prometheus
    networks:
      - reseau_app

volumes:
  jenkins_data:
  trivy_cache:
  prometheus_data:
  grafana_data: