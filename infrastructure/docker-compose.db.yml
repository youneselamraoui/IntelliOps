services:
  database:
    image: pgvector/pgvector:pg16
    container_name: intelliops_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE manquant dans .env.db}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant dans .env.db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env.db}
    ports:
      # DB_BIND_IP = IP de la carte réseau privée (VMnet) de la VM, jamais 0.0.0.0
      - "${DB_BIND_IP:?DB_BIND_IP manquant dans .env.db}:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - reseau_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:?PGADMIN_VERSION manquant dans .env.db}
    container_name: intelliops_pgadmin
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL manquant dans .env.db}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD manquant dans .env.db}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # Local à la VM par défaut. Accès : ssh -L 5050:127.0.0.1:5050 user@IP_VM
      - "${PGADMIN_BIND_IP:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - reseau_db

networks:
  reseau_db:
    driver: bridge

volumes:
  db_data:
  pgadmin_data: