name: intelliops-app

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: intelliops-backend:${TAG:-latest}
    volumes:
      - backend-storage:/var/www/html/storage
    networks:
      - reseau_app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    image: intelliops-frontend:${TAG:-latest}
    depends_on:
      - backend
    networks:
      - reseau_app

networks:
  reseau_app:
    driver: bridge

volumes:
  backend-storage: