services:
  database:
    image: pgvector/pgvector:pg16
    container_name: intelliops_db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - reseau_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: intelliops_backend
    depends_on:
      database:
        condition: service_healthy
    networks:
      - reseau_app

  frontend:
    build:
      context: ./frontend
    container_name: intelliops_frontend
    depends_on:
      - backend
    networks:
      - reseau_app

networks:
  reseau_app:
    driver: bridge

volumes:
  db_data: