name: intelliops-app

services:
  backend:
    build: ./backend
    image: intelliops-backend:${TAG}
    env_file: .env
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - backend-storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    image: intelliops-frontend:${TAG}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  backend-storage: